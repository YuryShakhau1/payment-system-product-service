server:
  port: ${PRODUCT_SERVICE_PORT:8082}

spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:postgresql://localhost:${PRODUCT_SERVICE_DB_PORT:5434}/${PRODUCT_SERVICE_DB_NAME:product_db}
    username: ${PRODUCT_SERVICE_DB_USERNAME:db_username}
    password: ${PRODUCT_SERVICE_DB_PASSWORD:db_password}

logging:
  level:
    root: INFO
